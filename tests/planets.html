<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Orbits — planet textures</title>
<style>
  html, body { margin: 0; background: #03050b; color: #cfe0ff; font: 13px ui-monospace, Menlo, Consolas, monospace; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #info { position: fixed; left: 12px; bottom: 10px; opacity: .8; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="info"></div>
<script src="../js/config.js"></script>
<script src="../js/orbit.js"></script>
<script src="../js/system.js"></script>
<script src="../js/planets.js"></script>
<script src="../js/render.js"></script>
<script>
  // Gallery of the GPU sphere textures. ?fallback=1 shows the 2D fallback instead.
  const sys = new SB.PlanetSystem(SB.CONFIG);
  if (/fallback=1/.test(location.search)) { SB.Planets.tried = true; SB.Planets.ok = false; }
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  function draw() {
    const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#03050b'; ctx.fillRect(0, 0, W, H);
    const discs = [];
    const r = Math.min(W / 8.6, H / 4.6);
    sys.bodies.forEach((b, i) => {
      const x = W * (i + 0.5) / 4, y = r * 1.25;
      SB.Render.drawBodyDisc(ctx, sys, b, x, y, r / b.radius, 0, 3000);
      ctx.fillStyle = '#cfe0ff'; ctx.textAlign = 'center';
      ctx.fillText(`${b.name} · ${b.kind}`, x, y + r * 1.18);
      discs.push({ id: b.id, x, y, r: r * 0.92 });
    });
    // close-ups (rendered region by region, like a zoomed map)
    const panels = [[sys.byId('pock'), 0.62, 0.55], [sys.planet, -0.5, -0.45]];
    panels.forEach(([b, ox, oy], i) => {
      const px = i === 0 ? 0 : W / 2, py = r * 2.7, pw = W / 2, ph = H - py;
      ctx.save();
      ctx.beginPath(); ctx.rect(px + 6, py, pw - 12, ph - 8); ctx.clip();
      const R = Math.max(pw, ph) * 1.6;
      SB.Render.drawBodyDisc(ctx, sys, b, px + pw / 2 - ox * R, py + ph / 2 + oy * R, R / b.radius, 0, 3000);
      ctx.restore();
      ctx.fillStyle = '#cfe0ff'; ctx.textAlign = 'left';
      ctx.fillText(`${b.name} close-up`, px + 14, py + 18);
    });
    return discs;
  }
  const t0 = performance.now();
  const discs = draw();
  const ms = performance.now() - t0;
  // texture statistics inside each disc: coverage, brightness, variation
  const dpr = window.devicePixelRatio || 1;
  const stats = discs.map((d) => {
    const img = ctx.getImageData(Math.round((d.x - d.r) * dpr), Math.round((d.y - d.r) * dpr), Math.round(2 * d.r * dpr), Math.round(2 * d.r * dpr)).data;
    let n = 0, sum = 0, sum2 = 0, cols = new Set();
    for (let i = 0; i < img.length; i += 4 * 7) {
      const l = 0.2126 * img[i] + 0.7152 * img[i + 1] + 0.0722 * img[i + 2];
      n++; sum += l; sum2 += l * l;
      cols.add((img[i] >> 4) * 256 + (img[i + 1] >> 4) * 16 + (img[i + 2] >> 4));
    }
    const mean = sum / n;
    return { id: d.id, mean: +mean.toFixed(1), std: +Math.sqrt(Math.max(0, sum2 / n - mean * mean)).toFixed(1), colours: cols.size };
  });
  window.PLANET_CHECK = { gpu: SB.Planets.ok, error: SB.Planets.error, renders: SB.Planets.renders, ms: Math.round(ms), stats };
  document.getElementById('info').textContent = SB.Planets.ok ? `GPU sphere textures · ${SB.Planets.renders} renders · ${Math.round(ms)} ms` : `2D fallback (${SB.Planets.error || 'forced'})`;
</script>
</body>
</html>
